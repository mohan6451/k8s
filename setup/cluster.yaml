apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
    name: cluster1
    region: us-east-1
managedNodeGroups:
  - name: cluster1
    instanceTypes: 
      - m5.large
      - m5a.large
      - c4.large
      - c5.large
      - c5a.large
    desiredCapacity: 3 #  by default this value is 3
    #spot: true
    minSize: 1
    maxSize: 3